name: AIMS-mini CI

on:
  push:
    branches: [ master, release/* ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Nếu có file requirements.txt thì cài thêm, ví dụ flake8 cho linting
        pip install flake8

    - name: Lint with flake8
      run: |
        # Kiểm tra lỗi cú pháp Python và định dạng code
        flake8 aims tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 aims tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Unit Tests
      env:
        PYTHONUTF8: 1
      run: |
        python -m unittest discover -s tests -v

        